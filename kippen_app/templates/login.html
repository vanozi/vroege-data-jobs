{% extends "base.html" %}

{% block title %}Inloggen | Kippen Registratie{% endblock %}

{% block content %}
<div class="columns is-centered">
  <div class="column is-one-third">
    <h1 class="title">Kippen Registratie</h1>
    <p class="subtitle">Log in om registraties te bekijken en in te voeren.</p>
    {% if error %}
    <div class="notification is-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login_post') }}">
      <div class="field">
        <label class="label" for="username">Gebruikersnaam</label>
        <div class="control">
          <input class="input" id="username" name="username" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label class="label" for="password">Wachtwoord</label>
        <div class="control">
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
          >
        </div>
      </div>
      <button class="button is-link" type="submit">Inloggen</button>
    </form>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Inloggen | Applicaties{% endblock %}

{% block content %}
<div class="columns is-centered">
  <div class="column is-one-third">
    <h1 class="title">Inloggen</h1>
    <p class="subtitle">Log in om je applicaties te openen.</p>
    {% if error %}
    <div class="notification is-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label class="label" for="email_address">E-mailadres</label>
        <div class="control">
          <input class="input" id="email_address" name="email_address" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label class="label" for="password">Wachtwoord</label>
        <div class="control">
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
          >
        </div>
      </div>
      <button class="button is-link" type="submit">Inloggen</button>
    </form>
  </div>
</div>
{% endblock %}

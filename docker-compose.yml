x-datajob-base: &datajob-base
  build:
    context: .
    dockerfile: docker/datajobs/Dockerfile
  profiles:
    - jobs
  env_file:
    - path: ./deploy/dashboard.env
      required: false
      format: raw
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - dashboards

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - dashboards

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gebroeders_vroege}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dashboards
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-migrate:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    profiles:
      - tools
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - alembic
      - -c
      - database/alembic.ini
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
      portal:
        condition: service_healthy
    networks:
      - dashboards

  auth-bootstrap:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    profiles:
      - tools
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - python
      - -m
      - shared_auth.scripts.bootstrap_admin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboards

  kippen-norms-seed:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    profiles:
      - tools
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - python
      - -m
      - database.seeds.load_lay_curve_norms
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboards

  kippen-dashboard-demo-seed:
    build:
      context: .
      dockerfile: docker/database/Dockerfile
    profiles:
      - tools
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - python
      - -m
      - database.seeds.load_demo_kippen_dashboard_data
      - --days
      - "180"
      - --seed
      - "7"
      - --house-id
      - main
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboards

  datajob-uniform-agri:
    <<: *datajob-base
    command:
      - python
      - -m
      - data_jobs.uniform_agri.scripts.koe_data
      - --include-details
      - --include-milkings

  datajob-klauwscore:
    <<: *datajob-base
    command:
      - python
      - -m
      - data_jobs.klauwscore.scripts.collect_klauwscore
      - --summary

  datajob-tank-terminal:
    <<: *datajob-base
    command:
      - python
      - -m
      - data_jobs.tank_terminal.scripts.collect_tank_terminal
      - --summary

  portal:
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - gunicorn
      - "dashboard_portal.app:create_app()"
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
    expose:
      - "8000"
    networks:
      - dashboards
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard-portal.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.dashboard-portal.entrypoints=websecure
      - traefik.http.routers.dashboard-portal.tls.certresolver=letsencrypt
      - traefik.http.routers.dashboard-portal.priority=1
      - traefik.http.routers.dashboard-portal.service=dashboard-portal
      - traefik.http.services.dashboard-portal.loadbalancer.server.port=8000
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  kippen-app:
    build:
      context: .
      dockerfile: docker/kippen/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - gunicorn
      - "kippen_app.app:create_app()"
      - --bind
      - 0.0.0.0:8010
      - --workers
      - "2"
    expose:
      - "8010"
    networks:
      - dashboards
    labels:
      - traefik.enable=true
      - traefik.http.routers.kippen-app.rule=Host(`${APP_HOST}`) && (Path(`/kippen`) || PathPrefix(`/kippen/`))
      - traefik.http.routers.kippen-app.entrypoints=websecure
      - traefik.http.routers.kippen-app.tls.certresolver=letsencrypt
      - traefik.http.routers.kippen-app.priority=110
      - traefik.http.routers.kippen-app.service=kippen-app
      - traefik.http.services.kippen-app.loadbalancer.server.port=8010
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/kippen/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  marimo-klauwgezondheid:
    build:
      context: .
      dockerfile: docker/marimo/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - python
      - -m
      - marimo
      - run
      - dashboard/klauwbehandeling_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "2718"
      - --base-url
      - /klauwgezondheid
      - --proxy
      - https://${APP_HOST}
      - --no-token
    expose:
      - "2718"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboards
    labels:
      - traefik.enable=true
      - traefik.http.routers.marimo-klauwgezondheid.rule=Host(`${APP_HOST}`) && PathPrefix(`/klauwgezondheid`)
      - traefik.http.routers.marimo-klauwgezondheid.entrypoints=websecure
      - traefik.http.routers.marimo-klauwgezondheid.tls.certresolver=letsencrypt
      - traefik.http.routers.marimo-klauwgezondheid.middlewares=portal-auth
      - traefik.http.routers.marimo-klauwgezondheid.priority=100
      - traefik.http.routers.marimo-klauwgezondheid.service=marimo-klauwgezondheid
      - traefik.http.services.marimo-klauwgezondheid.loadbalancer.server.port=2718
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
      - traefik.http.routers.marimo-klauwgezondheid-manifest.rule=Host(`${APP_HOST}`) && Path(`/klauwgezondheid/manifest.json`)
      - traefik.http.routers.marimo-klauwgezondheid-manifest.entrypoints=websecure
      - traefik.http.routers.marimo-klauwgezondheid-manifest.tls.certresolver=letsencrypt
      - traefik.http.routers.marimo-klauwgezondheid-manifest.middlewares=portal-auth
      - traefik.http.routers.marimo-klauwgezondheid-manifest.priority=200
      - traefik.http.routers.marimo-klauwgezondheid-manifest.service=marimo-klauwgezondheid

  marimo-kippen-dashboard:
    build:
      context: .
      dockerfile: docker/marimo/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - python
      - -m
      - marimo
      - run
      - dashboard/kippen_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "2720"
      - --base-url
      - /kippen-dashboard
      - --proxy
      - https://${APP_HOST}
      - --no-token
    expose:
      - "2720"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboards
    labels:
      - traefik.enable=true
      - traefik.http.routers.marimo-kippen-dashboard.rule=Host(`${APP_HOST}`) && PathPrefix(`/kippen-dashboard`)
      - traefik.http.routers.marimo-kippen-dashboard.entrypoints=websecure
      - traefik.http.routers.marimo-kippen-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.marimo-kippen-dashboard.middlewares=portal-auth
      - traefik.http.routers.marimo-kippen-dashboard.priority=100
      - traefik.http.routers.marimo-kippen-dashboard.service=marimo-kippen-dashboard
      - traefik.http.services.marimo-kippen-dashboard.loadbalancer.server.port=2720
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
      - traefik.http.routers.marimo-kippen-dashboard-manifest.rule=Host(`${APP_HOST}`) && Path(`/kippen-dashboard/manifest.json`)
      - traefik.http.routers.marimo-kippen-dashboard-manifest.entrypoints=websecure
      - traefik.http.routers.marimo-kippen-dashboard-manifest.tls.certresolver=letsencrypt
      - traefik.http.routers.marimo-kippen-dashboard-manifest.middlewares=portal-auth
      - traefik.http.routers.marimo-kippen-dashboard-manifest.priority=200
      - traefik.http.routers.marimo-kippen-dashboard-manifest.service=marimo-kippen-dashboard

  marimo-tank-terminal:
    build:
      context: .
      dockerfile: docker/marimo/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./deploy/dashboard.env
        required: false
        format: raw
    command:
      - python
      - -m
      - marimo
      - run
      - dashboard/tank_terminal_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "2719"
      - --base-url
      - /tank-terminal
      - --proxy
      - https://${APP_HOST}
      - --no-token
    expose:
      - "2719"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboards
    labels:
      - traefik.enable=true
      - traefik.http.routers.marimo-tank-terminal.rule=Host(`${APP_HOST}`) && PathPrefix(`/tank-terminal`)
      - traefik.http.routers.marimo-tank-terminal.entrypoints=websecure
      - traefik.http.routers.marimo-tank-terminal.tls.certresolver=letsencrypt
      - traefik.http.routers.marimo-tank-terminal.middlewares=portal-auth
      - traefik.http.routers.marimo-tank-terminal.priority=100
      - traefik.http.routers.marimo-tank-terminal.service=marimo-tank-terminal
      - traefik.http.services.marimo-tank-terminal.loadbalancer.server.port=2719
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
      - traefik.http.routers.marimo-tank-terminal-manifest.rule=Host(`${APP_HOST}`) && Path(`/tank-terminal/manifest.json`)
      - traefik.http.routers.marimo-tank-terminal-manifest.entrypoints=websecure
      - traefik.http.routers.marimo-tank-terminal-manifest.tls.certresolver=letsencrypt
      - traefik.http.routers.marimo-tank-terminal-manifest.middlewares=portal-auth
      - traefik.http.routers.marimo-tank-terminal-manifest.priority=200
      - traefik.http.routers.marimo-tank-terminal-manifest.service=marimo-tank-terminal

networks:
  dashboards:
    name: vroege_dashboards

volumes:
  traefik_letsencrypt:
  postgres_data:

services:
  traefik:
    command: !override
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports: !override
      - "80:80"

  portal:
    environment:
      PORTAL_COOKIE_SECURE: "false"
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.dashboard-portal.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && PathPrefix(`/`)
      - traefik.http.routers.dashboard-portal.entrypoints=web
      - traefik.http.routers.dashboard-portal.priority=1
      - traefik.http.routers.dashboard-portal.service=dashboard-portal
      - traefik.http.services.dashboard-portal.loadbalancer.server.port=8000
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    networks:
      - dashboards

  kippen-app:
    environment:
      KIPPEN_APP_COOKIE_SECURE: "false"
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.kippen-app.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && (Path(`/kippen`) || PathPrefix(`/kippen/`))
      - traefik.http.routers.kippen-app.entrypoints=web
      - traefik.http.routers.kippen-app.priority=110
      - traefik.http.routers.kippen-app.service=kippen-app
      - traefik.http.services.kippen-app.loadbalancer.server.port=8010

  marimo-klauwgezondheid:
    command: !override
      - python
      - -m
      - marimo
      - run
      - dashboard/klauwbehandeling_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "2718"
      - --base-url
      - /klauwgezondheid
      - --proxy
      - http://${APP_HOST}
      - --no-token
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.marimo-klauwgezondheid.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && PathPrefix(`/klauwgezondheid`)
      - traefik.http.routers.marimo-klauwgezondheid.entrypoints=web
      - traefik.http.routers.marimo-klauwgezondheid.middlewares=portal-auth
      - traefik.http.routers.marimo-klauwgezondheid.priority=100
      - traefik.http.routers.marimo-klauwgezondheid.service=marimo-klauwgezondheid
      - traefik.http.services.marimo-klauwgezondheid.loadbalancer.server.port=2718
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
      - traefik.http.routers.marimo-klauwgezondheid-manifest.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && Path(`/klauwgezondheid/manifest.json`)
      - traefik.http.routers.marimo-klauwgezondheid-manifest.entrypoints=web
      - traefik.http.routers.marimo-klauwgezondheid-manifest.middlewares=portal-auth
      - traefik.http.routers.marimo-klauwgezondheid-manifest.priority=200
      - traefik.http.routers.marimo-klauwgezondheid-manifest.service=marimo-klauwgezondheid

  marimo-kippen-dashboard:
    volumes:
      - ./dashboard:/app/dashboard
      - ./database:/app/database
      - ./data_jobs:/app/data_jobs
    command: !override
      - python
      - -m
      - marimo
      - run
      - dashboard/kippen_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "2720"
      - --base-url
      - /kippen-dashboard
      - --proxy
      - http://${APP_HOST}
      - --no-token
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.marimo-kippen-dashboard.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && PathPrefix(`/kippen-dashboard`)
      - traefik.http.routers.marimo-kippen-dashboard.entrypoints=web
      - traefik.http.routers.marimo-kippen-dashboard.middlewares=portal-auth
      - traefik.http.routers.marimo-kippen-dashboard.priority=100
      - traefik.http.routers.marimo-kippen-dashboard.service=marimo-kippen-dashboard
      - traefik.http.services.marimo-kippen-dashboard.loadbalancer.server.port=2720
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
      - traefik.http.routers.marimo-kippen-dashboard-manifest.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && Path(`/kippen-dashboard/manifest.json`)
      - traefik.http.routers.marimo-kippen-dashboard-manifest.entrypoints=web
      - traefik.http.routers.marimo-kippen-dashboard-manifest.middlewares=portal-auth
      - traefik.http.routers.marimo-kippen-dashboard-manifest.priority=200
      - traefik.http.routers.marimo-kippen-dashboard-manifest.service=marimo-kippen-dashboard

  marimo-tank-terminal:
    command: !override
      - python
      - -m
      - marimo
      - run
      - dashboard/tank_terminal_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "2719"
      - --base-url
      - /tank-terminal
      - --proxy
      - http://${APP_HOST}
      - --no-token
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.marimo-tank-terminal.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && PathPrefix(`/tank-terminal`)
      - traefik.http.routers.marimo-tank-terminal.entrypoints=web
      - traefik.http.routers.marimo-tank-terminal.middlewares=portal-auth
      - traefik.http.routers.marimo-tank-terminal.priority=100
      - traefik.http.routers.marimo-tank-terminal.service=marimo-tank-terminal
      - traefik.http.services.marimo-tank-terminal.loadbalancer.server.port=2719
      - traefik.http.middlewares.portal-auth.forwardauth.address=http://portal:8000/auth/verify
      - traefik.http.middlewares.portal-auth.forwardauth.trustForwardHeader=true
      - traefik.http.routers.marimo-tank-terminal-manifest.rule=(Host(`${APP_HOST}`) || Host(`127.0.0.1`)) && Path(`/tank-terminal/manifest.json`)
      - traefik.http.routers.marimo-tank-terminal-manifest.entrypoints=web
      - traefik.http.routers.marimo-tank-terminal-manifest.middlewares=portal-auth
      - traefik.http.routers.marimo-tank-terminal-manifest.priority=200
      - traefik.http.routers.marimo-tank-terminal-manifest.service=marimo-tank-terminal

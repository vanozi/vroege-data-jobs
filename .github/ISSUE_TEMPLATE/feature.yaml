name: Feature
description: Structured feature request for AI-assisted development
title: "[Feature]: "
labels: ["feature"]
body:

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are we solving?
      placeholder: |
        Users cannot...
        The current implementation...
    validations:
      required: true

  - type: textarea
    id: desired_solution
    attributes:
      label: Desired Solution
      description: Describe the expected end result
      placeholder: |
        We want...
        The API should...
        The UI should...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Concrete checklist for completion
      placeholder: |
        - [ ] Endpoint returns...
        - [ ] UI displays...
        - [ ] Tests added
        - [ ] Documentation updated
    validations:
      required: true

  - type: textarea
    id: technical_context
    attributes:
      label: Technical Context
      description: Relevant architecture or implementation details
      placeholder: |
        - Service: gateway-service
        - Module: auth-api
        - Database: PostgreSQL
        - Runs on Kubernetes
        - Uses Spring Boot
        - Related files:
          - src/main/...
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Constraints / Non-Goals
      description: Important limitations
      placeholder: |
        - Do not change public API
        - Backward compatibility required
        - No schema migration
        - Avoid adding dependencies
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, screenshots, docs
      placeholder: |
        - Related issue: #123
        - PR: #456
        - Design doc:
        - Screenshot:
    validations:
      required: false

  - type: textarea
    id: test_plan
    attributes:
      label: Test Plan
      description: How should this be verified?
      placeholder: |
        - Run integration tests
        - Verify locally
        - Validate metrics in Elastic APM
        - Test on Kubernetes staging
    validations:
      required: false